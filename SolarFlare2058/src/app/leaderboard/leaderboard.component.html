<div class="flex items-center justify-center bg-gray-100">
  <div class="rounded-lg w-96 p-6 max-h-[60vh] bg-white flex flex-col">

    <!-- Header (fixed at top of modal) -->
    <div class="flex items-center mb-4 shrink-0">
      <h2 class="text-xl font-semibold flex-[0.8]">Leaderboard:</h2>
      <h1 class="text-xl font-bold text-right flex-[0.2] cursor-pointer" (click)="closeDialog()">X</h1>
    </div>

    <!-- Scrollable content -->
    
    <div class="flex gap-4 overflow-y-auto">
      <div class="flex-1">
        <p *ngFor="let item of scores">{{ item.username }}</p>
      </div>
      <div class="flex-1 text-right">
        <p *ngFor="let item of scores">{{ item.score }}</p>
      </div>
    </div>
  </div>
</div>
